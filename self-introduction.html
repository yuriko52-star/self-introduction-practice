<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>「自己紹介-あなたの名前」</title>
</head>

<body>
    <h1>自己紹介</h1>
    <h2>プロフィール</h2>
    <p>名前</p>
    <p>年齢</p>
    <p>出身地</p>
    <p>趣味</p>
    <h2>好きなもの</h2>
    <ul>
        <li>お菓子</li>
        <li>手作りパン</li>
        <li>チーズ</li>
    </ul>
    <h2>今年の目標</h2>
    <ol>
        <li>障害年金を申請してきちんと受け取る</li>
        <li>エンジニアの道を進む</li>
        <li>毎日楽しく過ごす</li>
    </ol>
    <h2>リンク</h2>
    <a href="https://github.com/yuriko52-star/kakeibo-app" target="_blank">私のGitHub</a>
    <h2>好きな風景</h2>
    <img src="landscape.jpg" alt="好きな風景" width="400px">
    <h2>お問い合わせ</h2>

    <form action="submit" method="POST">
        <label>お名前:</label>
        <input type="text" name="name" required> <br>
        <label>お問合せ種別:</label>
        <select name="contacts" id="">
            <option value="">選んでください</option>
            <option value="general-contact">一般的なお問い合わせ</option>
            <option value="require">ご意見・ご要望</option>
        </select> <br>
        <label>お問い合わせ内容:</label>
        <textarea name="content" id="" required></textarea> <br>

        <button type="submit">送信</button>
    </form>
    </div>
</body>

</html>
